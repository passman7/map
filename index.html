<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>pass mapker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; font-family: 'SUIT', sans-serif; }
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    #controls {
      position: absolute; top: 10px; left: 10px;
      z-index: 100; display: flex; flex-direction: column; gap: 6px;
      background: white; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    #controls input, #controls select {
      padding: 6px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc;
    }
    #exportBtn {
      position: absolute; bottom: 20px; right: 20px;
      z-index: 100; background: #0078FF; color: white;
      padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer;
    }
    .popup, .input-form {
      font-size: 14px;
      line-height: 1.6;
      width: 240px;
      padding: 10px;
      font-family: 'SUIT', sans-serif;
    }
    .popup textarea, .input-form input {
      width: 100%;
      padding: 6px;
      font-size: 13px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .popup textarea {
      height: 70px;
      resize: none;
    }
    .popup button, .input-form button {
      margin-top: 8px;
      margin-right: 6px;
      padding: 6px 10px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      background: #0078FF;
      color: white;
      cursor: pointer;
    }
    .popup button:last-child, .input-form button:last-child {
      background: #ccc;
      color: #333;
    }
    .popup .close-btn {
      float: right;
      font-size: 13px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: #999;
      margin-top: -4px;
      margin-right: -4px;
    }
    .popup a {
      color: #0078FF;
      text-decoration: underline;
      font-size: 13px;
    }
  </style>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d7e491600cda23ba800b2265c04daa63&libraries=services,clusterer"></script>
</head>
<body>
  <div id="controls">
    <input type="text" id="search" placeholder="사업장명 검색" />
    <select id="yearFilter"><option value="all">전체 연도</option></select>
    <select id="typeFilter"><option value="all">전체 구분</option></select>
    <input type="text" id="addrSearch" placeholder="주소 검색 (Enter)" />
  </div>
  <button id="exportBtn">📤 엑셀로 내보내기</button>
  <div id="map"></div>

  <!-- 이하 JS 스크립트는 그대로 유지됩니다 -->
</body>
</html>
