<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title> 우리의 대동여지도 </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d7e491600cda23ba800b2265c04daa63&libraries=services,clusterer"></script>
  <style>

    /* 공통 스타일 정의 */
    :root {
      --primary: #0078FF;
      --secondary: #f0f2f5;
      --font: 'SUIT', sans-serif;
      --radius: 12px;
      --text: #333;
      --card-bg: #fff;
    }
    * { box-sizing: border-box; font-family: var(--font); }
    html, body { margin: 0; padding: 0; height: 100%; background-color: var(--secondary); color: var(--text); }

    /* 상단 헤더 */
    header {
      position: absolute; top: 0; left: 0; right: 0; height: 56px; padding: 0 20px;
      background: var(--card-bg); display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 600; color: var(--primary); }

    /* 지도 영역 */
    #map { width: 100%; height: 100%; }

    /* 좌측 검색 필터 패널 */
    #controls {
      position: absolute; top: 70px; left: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px;
      background: var(--card-bg); padding: 18px; border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); max-width: 260px;
    }
    #controls label { font-size: 13px; margin-bottom: 4px; font-weight: 600; }
    #controls input, #controls select {
      padding: 10px 12px; font-size: 15px; border-radius: 8px; border: 1px solid #ccc; background: #fafafa;
    }

    /* 우측 하단 기능 버튼 */
    .map-action {
      position: absolute; right: 30px; bottom: 30px;
      display: flex; flex-direction: column; gap: 10px; z-index: 100;
    }
    .map-action button {
      background: var(--primary); color: white; padding: 12px 20px; border: none;
      border-radius: var(--radius); cursor: pointer; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); transition: transform 0.15s ease-in-out; font-size: 14px;
    }
    .map-action button:hover { transform: scale(1.05); }

    /* 입력창 및 마커 메모 팝업 스타일 */
    .popup, .input-form {
      font-size: 14px; line-height: 1.6; width: 260px; padding: 12px;
      font-family: var(--font);
    }
    .popup textarea, .input-form input {
      width: 100%; padding: 8px; font-size: 13px; margin-top: 6px;
      border: 1px solid #ccc; border-radius: 8px;
    }
    .popup textarea { height: 70px; resize: none; }
    .popup button, .input-form button {
      margin-top: 10px; margin-right: 6px; padding: 8px 12px;
      font-size: 13px; border: none; border-radius: 6px;
      background: var(--primary); color: white; cursor: pointer;
    }
    .popup button:last-child, .input-form button:last-child { background: #ccc; color: var(--text); }
    .popup .close-btn {
      float: right; font-size: 13px; cursor: pointer; background: transparent;
      border: none; color: #999; margin-top: -4px; margin-right: -4px;
    }
    .popup a {
      display: inline-block; margin-top: 6px; color: var(--primary);
      text-decoration: underline; font-size: 13px;
    }

    /* 토글 버튼 스타일 (모바일에서만 보임) */
    #toggleControlsBtn {
      position: absolute; top: 70px; left: 20px; z-index: 101;
      background: var(--primary); color: white; padding: 10px 15px; border: none;
      border-radius: var(--radius); cursor: pointer; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); display: none; /* 기본적으로 숨김 */
    }

    /* 미디어 쿼리 for 모바일 (최대 768px) */
    @media (max-width: 768px) {
      header { padding: 0 15px; }
      header h1 { font-size: 16px; }

      #controls {
        top: 66px; /* 헤더 아래로 조정 */
        left: 15px;
        right: 15px;
        max-width: unset; /* 최대 너비 제한 해제 */
        width: auto; /* 너비를 자동으로 설정 */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: none; /* 모바일에서 기본적으로 숨김 */
      }

      #toggleControlsBtn {
        display: block; /* 모바일에서만 보임 */
      }
      
      .map-action {
        right: 15px;
        bottom: 15px;
      }

      .map-action button {
        padding: 10px 18px;
        font-size: 13px;
      }

      .popup, .input-form {
        width: calc(100vw - 60px); /* 화면 너비에 맞춰 조정 */
        max-width: 300px; /* 너무 커지지 않도록 최대 너비 설정 */
      }
    }
  </style>
</head>

<body>
<header>
  <h1>나의 대동여지도</h1>
  <span>by.mapker</span>
</header>
<div id="map"></div>
<button id="toggleControlsBtn">🔍 검색 열기/닫기</button> <div id="controls">
  <label for="search">점포명</label>
  <input type="text" id="search" placeholder="점포명 검색" />
  <label for="startYear">시작 연도</label>
  <input type="number" id="startYear" placeholder="시작 연도" value="2025" />
  <label for="endYear">종료 연도</label>
  <input type="number" id="endYear" placeholder="종료 연도" value="2025" />
  <label for="typeFilter">구분</label>
  <select id="typeFilter">
    <option value="all">전체 구분</option>
  </select>
  <label for="addrSearch">주소 검색</label>
  <input type="text" id="addrSearch" placeholder="주소 검색 (Enter)" />
</div>
<div class="map-action">
  <button id="locateBtn">📍 내 위치</button>
  <button id="exportBtn">📤 엑셀 저장</button>
</div>

  <script>

    /* 전역 변수 */
let map, clusterer, geocoder, searchMarker = null, currentMarker = null;
let allData = [], userData = [], markers = [], infowindow = null;
let editingStoreId = null;

    // 지도 초기화 //
    document.addEventListener("DOMContentLoaded", function() {
      
        const markerIcons = {
        violet: 'https://mapmarker.io/api/v1/pin?size=100&background=%238e44ad&icon=fa-store&color=fff',
        blue: 'https://mapmarker.io/api/v1/pin?size=100&background=%233498db&icon=fa-store&color=fff',
        yellow: 'https://mapmarker.io/api/v1/pin?size=100&background=%23f1c40f&icon=fa-store&color=fff',
        red: 'https://mapmarker.io/api/v1/pin?size=100&background=%23e74c3c&icon=fa-store&color=fff',
        green: 'https://mapmarker.io/api/v1/pin?size=100&background=%2327ae60&icon=fa-store&color=fff',
        star: 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
        pin: 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/red_b.png'
      };

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(35.8714, 128.6014), level: 6
      });
      geocoder = new kakao.maps.services.Geocoder();
      clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 6 });

      // 지도의 'idle' 이벤트 리스너 추가
      kakao.maps.event.addListener(map, 'idle', render);

      map.addListener("rightclick", e => showInputForm(e.latLng));
      document.getElementById("addrSearch").addEventListener("keypress", e => { if (e.key === "Enter") searchAddress(); });
      
      // '점포명 검색' 입력 필드에서 Enter 키 눌렀을 때도 지도 이동 기능 추가
      document.getElementById("search").addEventListener("input", triggerRenderAfterFilterChange);
      document.getElementById("search").addEventListener("keypress", e => {
        if (e.key === "Enter") {
          triggerRenderAfterFilterChange(true); // Enter 시에는 지도 이동 강제 (true 전달)
        }
      });

      document.getElementById("typeFilter").addEventListener("change", triggerRenderAfterFilterChange);
      document.getElementById("startYear").addEventListener("input", triggerRenderAfterFilterChange);
      document.getElementById("endYear").addEventListener("input", triggerRenderAfterFilterChange);

      document.getElementById("exportBtn").addEventListener("click", exportCSV);
      document.getElementById("locateBtn").addEventListener("click", goToCurrentLocation);

      // 토글 버튼 이벤트 리스너 추가
      document.getElementById("toggleControlsBtn").addEventListener("click", () => {
        const controls = document.getElementById("controls");
        if (controls.style.display === "none" || controls.style.display === "") {
          controls.style.display = "flex";
        } else {
          controls.style.display = "none";
        }
      });


      fetch("store_data.json")
        .then(res => res.json())
        .then(data => {
          allData = data;
          populateFilters();
          render(); // 초기 로딩 시에도 render 호출
        });

      function triggerRenderAfterFilterChange(mapMoveToResult = false) {
        render(mapMoveToResult); // mapMoveToResult 값을 render 함수로 전달
      }

      function getMarkerImage(name, isUser) {
        if (isUser) return new kakao.maps.MarkerImage(markerIcons.star, new kakao.maps.Size(30, 30));
        if (name.includes('CU')) return new kakao.maps.MarkerImage(markerIcons.violet, new kakao.maps.Size(40, 40));
        if (name.includes('지에스') || name.includes('GS')) return new kakao.maps.MarkerImage(markerIcons.blue, new kakao.maps.Size(40, 40));
        if (name.includes('이마트24')) return new kakao.maps.MarkerImage(markerIcons.yellow, new kakao.maps.Size(40, 40));
        if (name.includes('세븐')) return new kakao.maps.MarkerImage(markerIcons.red, new kakao.maps.Size(40, 40));
        return new kakao.maps.MarkerImage(markerIcons.green, new kakao.maps.Size(40, 40));
      }

      function populateFilters() {
        const years = new Set(), types = new Set();
        allData.forEach(d => {
          if (d['인허가일자']) years.add(d['인허가일자'].substring(0, 4));
          if (d['구분']) types.add(d['구분']);
        });
        const typeSel = document.getElementById("typeFilter");
        [...types].sort().forEach(t => {
          const opt = document.createElement("option");
          opt.value = t; opt.text = t;
          typeSel.appendChild(opt);
        });
      }

      function render(mapMoveToResult = false) {
        clusterer.clear();
        markers.forEach(m => m.setMap(null));
        markers = [];

        const keyword = document.getElementById("search").value.trim();
        const startYear = parseInt(document.getElementById("startYear").value, 10);
        const endYear = parseInt(document.getElementById("endYear").value, 10);
        const type = document.getElementById("typeFilter").value;

        const bounds = map.getBounds();
        const southWest = bounds.getSouthWest();
        const northEast = bounds.getNorthEast();

        const filtered = [...allData, ...userData].filter(d => {
          const name = d['사업장명'] ?? d['점포명'] ?? '';
          const date = (d['인허가일자'] ?? d['수정일'])?.substring(0, 4);
          const matchName = !keyword || name.includes(keyword);
          const matchYear = (!startYear || !endYear) || (date >= startYear && date <= endYear);
          const matchType = type === "all" || (d['구분'] ?? "추진 물건") === type;

          const lat = parseFloat(d.lat);
          const lon = parseFloat(d.lon);
          
          const inBounds = (lat >= southWest.getLat() && lat <= northEast.getLat()) &&
                           (lon >= southWest.getLng() && lon <= northEast.getLng());
          
          return matchName && matchYear && matchType && (keyword ? true : inBounds);
        });

        if (mapMoveToResult && filtered.length > 0) {
            if (filtered.length === 1) {
                const targetStore = filtered[0];
                const moveLatLon = new kakao.maps.LatLng(parseFloat(targetStore.lat), parseFloat(targetStore.lon));
                map.setCenter(moveLatLon);
                map.setLevel(4);
            } else {
                const bounds = new kakao.maps.LatLngBounds();
                filtered.forEach(store => {
                    bounds.extend(new kakao.maps.LatLng(parseFloat(store.lat), parseFloat(store.lon)));
                });
                map.setBounds(bounds);
            }
        }


        filtered.forEach(store => {
          const lat = parseFloat(store.lat), lon = parseFloat(store.lon);
          const name = store['사업장명'] ?? store['점포명'] ?? '';
          const isUser = !!store['점포명'];
          const marker = new kakao.maps.Marker({
            position: new kakao.maps.LatLng(lat, lon),
            image: getMarkerImage(name, isUser)
          });
          marker.setMap(map);
          markers.push(marker);

          const popup = document.createElement("div");
          popup.className = "popup";
          popup.innerHTML = `<button class='close-btn' onclick='window.infowindow.close()'>✖</button>`;
       
          if (isUser) { // 사용자 추가 마커 (추진 물건)
            popup.innerHTML += `
              <div><strong>${store['점포명']}</strong></div>
              <div>담당자: ${store['담당자']}</div>
              <div>개발팀: ${store['개발팀']}</div>
              <div>면적: ${store['면적']}</div>
              <div>보증금: ${store['보증금']}</div>
              <div>권리금: ${store['권리금']}</div>
              <div>임차료: ${store['임차료']}</div>
              <div>수정일: ${store['수정일']}</div>
              <a href='https://map.kakao.com/link/map/${encodeURIComponent(store["점포명"] ?? "")},${store.lat},${store.lon}' target='_blank'>📍 카카오맵에서 보기</a>
              <div style="margin-top: 10px;"> 
                <button onclick="deleteData('${store.id}')">🗑️ 삭제</button>
              </div>`;
          } else { // 인허가 마커 (기존 데이터)
            const memoKey = lat + "," + lon;
            const memo = localStorage.getItem(memoKey) || "";
            const now = new Date().toLocaleString();
            popup.innerHTML += `
              <div><strong>${store['사업장명']}</strong></div>
              <div>${store['인허가일자']}</div>
              <a href='https://map.kakao.com/link/search/${encodeURIComponent(store["사업장명"] ?? "")}' target='_blank'>📍 카카오맵에서 보기</a>
              <textarea>${memo}</textarea><br>
              <small>🕒 ${now}</small><br>
              <button onclick="saveMemo('${memoKey}', this)">💾 저장</button>
              <button onclick="deleteMemo('${memoKey}', this)">❌ 삭제</button>`;
          }

          kakao.maps.event.addListener(marker, 'click', function() {
            if (infowindow) infowindow.close();
            infowindow = new kakao.maps.InfoWindow({ content: popup });
            infowindow.open(map, marker);
            window.infowindow = infowindow;
          });
        });

        clusterer.addMarkers(markers);
      }

      function generateUniqueId() {
        return 'id-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
      }

      function showInputForm(latlng) {
        if (infowindow) infowindow.close();

        const now = new Date().toISOString().split("T")[0];
        const div = document.createElement("div");
        div.className = "input-form";
        div.innerHTML = `
          <strong>물건 정보 입력</strong><br>
          담당자: <input id="mgr"><br>
          개발팀: <input id="team"><br>
          점포명: <input id="name"><br>
          면적: <input id="size"><br>
          보증금: <input id="deposit"><br>
          권리금: <input id="premium"><br>
          임차료: <input id="rent"><br>
          수정일: <input id="date" value="${now}"><br>
          <button onclick="addUserData(${latlng.getLat()}, ${latlng.getLng()}, this)">저장</button>
          <button onclick="removeInputWindow()">취소</button>
          <button onclick="deleteDataByLatLng(${latlng.getLat()}, ${latlng.getLng()})">🗑️ 삭제</button>
        `;

        infowindow = new kakao.maps.InfoWindow({ position: latlng, content: div });
        infowindow.open(map);
        window.infowindow = infowindow;
        window.infowindowDom = div;
      }

      window.removeInputWindow = function() {
        if (window.infowindow) window.infowindow.close();
        if (window.infowindowDom) window.infowindowDom.remove();
        window.infowindowDom = null;
      }

      window.addUserData = function(lat, lon, el) {
        const p = el.parentElement;
        const d = {
            id: generateUniqueId(),
            구분: "추진 물건",
            lat, lon,
            담당자: p.querySelector("#mgr").value,
            개발팀: p.querySelector("#team").value,
            점포명: p.querySelector("#name").value,
            면적: p.querySelector("#size").value,
            보증금: p.querySelector("#deposit").value,
            권리금: p.querySelector("#premium").value,
            임차료: p.querySelector("#rent").value,
            수정일: p.querySelector("#date").value
        };
        userData.push(d);
        render();
        if (infowindow) infowindow.close();
      }

      window.saveMemo = function(key, el) {
        const val = el.parentElement.querySelector("textarea").value;
        localStorage.setItem(key, val);
        alert("저장되었습니다.");
        if (infowindow) infowindow.close();
      }

      window.deleteMemo = function(key, el) {
        localStorage.removeItem(key);
        el.parentElement.querySelector("textarea").value = "";
        alert("삭제되었습니다.");
        if (infowindow) infowindow.close();
      }

      function exportCSV() {
        const rows = [["담당자","개발팀","점포명","면적","보증금","권리금","임차료","수정일","위도","경도"]];
        userData.forEach(d => {
          rows.push([d.담당자, d.개발팀, d.점포명, d.면적, d.보증금, d.권리금, d.임차료, d.수정일, d.lat, d.lon]);
        });
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n")], {
          type: "text/csv;charset=utf-8;"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "물건정보.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function searchAddress() {
        const keyword = document.getElementById("addrSearch").value;
        geocoder.addressSearch(keyword, (result, status) => {
          if (status === kakao.maps.services.Status.OK) {
            const loc = new kakao.maps.LatLng(result[0].y, result[0].x);
            map.setCenter(loc);
            if (searchMarker) searchMarker.setMap(null);
            searchMarker = new kakao.maps.Marker({
              map, position: loc,
              image: new kakao.maps.MarkerImage(markerIcons.pin, new kakao.maps.Size(30, 30))
            });
            render(); // 주소 검색 후 지도가 이동했으므로, 해당 뷰포트의 마커 렌더링
          } else {
            alert("주소를 찾을 수 없습니다.");
          }
        });
      }

      function goToCurrentLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            const latlng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            map.setCenter(latlng);
            if (currentMarker) currentMarker.setMap(null);
            currentMarker = new kakao.maps.Marker({
              map, position: latlng,
              image: new kakao.maps.MarkerImage(markerIcons.pin, new kakao.maps.Size(30, 30))
            });
            render(); // 현재 위치 이동 후 해당 뷰포트의 마커 렌더링
          }, () => alert("위치 정보를 가져올 수 없습니다."));
        }
      }

      function saveData() {
        // ... (기존 saveData 함수 내용, 현재는 사용되지 않음)
      }

      window.deleteData = function(id) {
        if (!confirm("정말 삭제하시겠습니까?")) {
          return;
        }

        const initialUserCount = userData.length;
        userData = userData.filter(item => item.id !== id);

        if (userData.length < initialUserCount) {
          alert("삭제되었습니다.");
          if (infowindow) infowindow.close();
          render();
          return;
        }

        alert("삭제할 데이터를 찾을 수 없습니다. (ID: " + id + ")");
      };

      window.deleteDataByLatLng = function(lat, lon) {
        if (!confirm("정말 삭제하시겠습니까?")) {
          return;
        }

        const initialUserCount = userData.length;
        userData = userData.filter(d => !(parseFloat(d.lat) === lat && parseFloat(d.lon) === lon));

        if (userData.length < initialUserCount) {
          alert("삭제되었습니다.");
          if (infowindow) infowindow.close();
          render();
        } else {
          alert("삭제할 데이터를 찾을 수 없습니다.");
        }
      };
    });
  </script>
</body>
</html>
