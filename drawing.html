<!-- 낙서장 1: Kakao Map + Canvas (파일명: kakao_doodle.html) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>KakaoMap 낙서장</title>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; height: 100%; }
    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 10;
    }
    #tools {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 20;
      background: white;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="drawLayer"></canvas>
  <div id="tools">
    <button id="clear">전체 지우기</button>
    <button id="save">저장</button>
  </div>

  <script>
    const map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 3
    });

    const canvas = document.getElementById('drawLayer');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let drawing = false;
    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 3;
      ctx.stroke();
    });
    canvas.addEventListener('pointerup', () => drawing = false);

    document.getElementById('save').addEventListener('click', () => {
      localStorage.setItem('kakao_doodle', canvas.toDataURL());
    });
    document.getElementById('clear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      localStorage.removeItem('kakao_doodle');
    });

    const saved = localStorage.getItem('kakao_doodle');
    if (saved) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = saved;
    }
  </script>
</body>
</html>

<!-- 낙서장 2: Leaflet + Canvas (파일명: leaflet_doodle.html) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Leaflet 낙서장</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; height: 100%; }
    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 10;
    }
    #tools {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 20;
      background: white;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="drawLayer"></canvas>
  <div id="tools">
    <button id="clear">전체 지우기</button>
    <button id="save">저장</button>
  </div>
  <script>
    const map = L.map('map').setView([37.5665, 126.9780], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const canvas = document.getElementById('drawLayer');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let drawing = false;
    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.strokeStyle = '#0000ff';
      ctx.lineWidth = 3;
      ctx.stroke();
    });
    canvas.addEventListener('pointerup', () => drawing = false);

    document.getElementById('save').addEventListener('click', () => {
      localStorage.setItem('leaflet_doodle', canvas.toDataURL());
    });
    document.getElementById('clear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      localStorage.removeItem('leaflet_doodle');
    });

    const saved = localStorage.getItem('leaflet_doodle');
    if (saved) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = saved;
    }
  </script>
</body>
</html>
